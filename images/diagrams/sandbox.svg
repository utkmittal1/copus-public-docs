<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img" aria-labelledby="ttl desc">
  <title id="ttl">The sandbox: writes confined, reads limited</title>
  <desc id="desc">A task sits inside its write boundary, the session's own folder. Its writes stop at the boundary. Its reads reach your Desktop, Documents, Downloads and Pictures, the folders and files you give it, and files other tasks made. The rest of your home folder and credential stores are closed to every task. macOS enforces the boundary below the level of any program.</desc>
  <style>
    svg { --ink:#1a1712; --fill:#f4f0e6; --accent:#a03a22; }
    @media (prefers-color-scheme: dark) { svg { --ink:#e9eae4; --fill:#242b27; --accent:#b4552e; } }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
    .box { fill:var(--fill); stroke:var(--ink); stroke-opacity:.45; stroke-width:1.5; }
    .shell { fill:none; stroke:var(--ink); stroke-opacity:.45; stroke-width:1.5; }
    .acc-shell { fill:none; stroke:var(--accent); stroke-width:2; }
    .blocked { fill:none; stroke:var(--ink); stroke-opacity:.45; stroke-width:1.5; stroke-dasharray:6 5; }
    .t { font-size:16px; font-weight:600; }
    .c { font-size:14px; font-weight:600; }
    .s { font-size:13.5px; fill-opacity:.72; }
    .xs { font-size:12px; fill-opacity:.72; }
    .ln { fill:none; stroke:var(--ink); stroke-opacity:.55; stroke-width:1.5; marker-end:url(#ar); }
    .acc-ln { fill:none; stroke:var(--accent); stroke-width:1.75; marker-end:url(#stop); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="var(--ink)" fill-opacity=".55"/>
    </marker>
    <marker id="stop" viewBox="0 0 12 24" refX="6" refY="12" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="24" orient="auto">
      <path d="M6 1 V23" stroke="var(--accent)" stroke-width="3" fill="none"/>
    </marker>
  </defs>

  <rect class="acc-shell" x="30" y="60" width="310" height="290" rx="12"/>
  <text class="t" x="54" y="94">Write boundary</text>
  <text class="s" x="54" y="116">the session's own folder</text>

  <rect class="box" x="54" y="160" width="200" height="68" rx="10"/>
  <text class="c" x="154" y="200" text-anchor="middle">This task</text>

  <text class="xs" x="250" y="268" text-anchor="middle">writes</text>
  <path class="acc-ln" d="M154 228 V268 Q154 278 164 278 H340"/>
  <path d="M340 256 V300" stroke="var(--accent)" stroke-width="5" fill="none"/>

  <text class="s" x="54" y="330">It writes here and nowhere else.</text>

  <text class="s" x="440" y="112" text-anchor="middle">reads</text>
  <path class="ln" d="M254 174 C 300 174 304 127 344 127 H532"/>
  <path class="ln" d="M254 194 C 300 194 304 181 344 181 H532"/>
  <path class="ln" d="M254 214 C 300 214 304 235 344 235 H532"/>

  <rect class="shell" x="540" y="60" width="310" height="290" rx="12"/>
  <text class="t" x="564" y="94">What it reads</text>

  <rect class="box" x="564" y="104" width="262" height="46" rx="8"/>
  <text class="s" x="580" y="123">Desktop, Documents,</text>
  <text class="s" x="580" y="141">Downloads, Pictures</text>

  <rect class="box" x="564" y="158" width="262" height="46" rx="8"/>
  <text class="s" x="580" y="187">Folders and files you give it</text>

  <rect class="box" x="564" y="212" width="262" height="46" rx="8"/>
  <text class="s" x="580" y="241">Files other tasks made</text>

  <rect class="blocked" x="564" y="272" width="262" height="62" rx="8"/>
  <circle cx="588" cy="303" r="9" fill="none" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.75"/>
  <path d="M582 309 L594 297" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.75" fill="none"/>
  <text class="c" x="608" y="298">Rest of your home folder</text>
  <text class="xs" x="608" y="318">and credential stores: closed</text>

  <text class="s" x="30" y="390">macOS enforces the boundary below the level of any program.</text>
</svg>
